name: Weekly Ratings Refresh

on:
  schedule:
    # Paired UTC triggers cover 01:07 ET across daylight-saving changes. The
    # application route admits only the matching Eastern-time invocation.
    - cron: "7 5 * 3-10 1"
    - cron: "7 6 * 3-10 1"
  workflow_dispatch:

concurrency:
  group: weekly-ratings-refresh-production
  cancel-in-progress: false

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Select the active Eastern-time trigger
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          if (process.env.EVENT_NAME === "workflow_dispatch") {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_run=true\n")
            process.exit(0)
          }

          const offsetPart = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/New_York",
            timeZoneName: "shortOffset"
          }).formatToParts(new Date()).find((part) => part.type === "timeZoneName")
          const offsetHours = Number(offsetPart?.value.replace("GMT", ""))
          const expectedSchedule = offsetHours === -4
            ? "7 5 * 3-10 1"
            : "7 6 * 3-10 1"
          const shouldRun = process.env.SCHEDULE === expectedSchedule

          console.log(`Eastern UTC offset: ${offsetHours}; active schedule: ${expectedSchedule}`)
          console.log(shouldRun ? "Running active weekly trigger." : "Skipping paired DST trigger.")
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${shouldRun}\n`)
          NODE

      - name: Trigger authenticated weekly ratings refresh
        if: steps.gate.outputs.should_run == 'true'
        env:
          # The deployment origin is not sensitive, so allow it to be stored as
          # either a repository variable or the legacy repository secret.
          PIPELINE_BASE_URL: ${{ vars.PIPELINE_BASE_URL || secrets.PIPELINE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ -z "$PIPELINE_BASE_URL" ]]; then
            echo "Missing PIPELINE_BASE_URL. Configure it as a GitHub Actions repository variable or secret."
            exit 1
          fi

          CLEAN_CRON_SECRET="$(printf %s "$CRON_SECRET" | tr -d "\r\n")"
          CLEAN_ADMIN_API_SECRET="$(printf %s "$ADMIN_API_SECRET" | tr -d "\r\n")"
          AUTH_SECRET="${CLEAN_CRON_SECRET:-$CLEAN_ADMIN_API_SECRET}"

          if [[ -z "$AUTH_SECRET" ]]; then
            echo "Missing authentication. Configure CRON_SECRET (preferred) or ADMIN_API_SECRET as a GitHub Actions repository secret."
            exit 1
          fi

          ENDPOINT_URL="${PIPELINE_BASE_URL%/}/api/cron/runWeeklyRatingsRefresh"

          # The route accepts the operational admin credential only for forced
          # refreshes. CRON_SECRET remains the preferred scheduled credential.
          if [[ "$MANUAL_RUN" == "true" || -z "$CLEAN_CRON_SECRET" ]]; then
            ENDPOINT_URL="${ENDPOINT_URL}?force=true"
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status_code="$(curl --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${AUTH_SECRET}" \
            --header "Content-Type: application/json" \
            --output "$response_file" \
            --write-out "%{http_code}" \
            "$ENDPOINT_URL")"

          cat "$response_file"

          if [[ ! "$status_code" =~ ^2 ]]; then
            printf '## Weekly ratings refresh\n\n- Status: failed (HTTP %s)\n- Ratings build did not receive a verified success response.\n' \
              "$status_code" >> "$GITHUB_STEP_SUMMARY"
            echo "Weekly ratings refresh failed with HTTP ${status_code}."
            exit 1
          fi

          if ! node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (payload.skipped) process.exit(0);
            if (!payload.ok || !payload.metadataVerified) process.exit(1);
            const summary = [
              "## Weekly ratings refresh",
              "",
              `- Status: ${payload.status}`,
              `- Current season refreshed: ${payload.seasonRefreshed}`,
              `- Historical loader: succeeded (${payload.historicalGamesLoaded} final games)`,
              `- Ratings build: succeeded (${payload.ratingsCount} team ratings)`,
              `- Historical range: ${payload.ratingsBuild.metadata.startSeason}-${payload.latestSeasonIncluded}`,
              `- Ratings generated: ${payload.ratingsGeneratedAt}`,
              `- Duration: ${payload.durationMs} ms`
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
            console.log(`Refresh complete: season=${payload.seasonRefreshed}, games=${payload.historicalGamesLoaded}, ratings=${payload.ratingsCount}, generatedAt=${payload.ratingsGeneratedAt}, durationMs=${payload.durationMs}`);
          ' "$response_file"; then
            printf '## Weekly ratings refresh\n\n- Status: failed (metadata verification was not confirmed)\n' \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Weekly ratings refresh response did not confirm successful metadata verification."
            exit 1
          fi
