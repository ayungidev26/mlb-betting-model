name: Weekly Ratings Refresh

on:
  schedule:
    # Paired UTC triggers cover 01:07 ET across daylight-saving changes. The
    # application route admits only the matching Eastern-time invocation.
    - cron: "7 5 * 3-10 1"
    - cron: "7 6 * 3-10 1"
  workflow_dispatch:

concurrency:
  group: weekly-ratings-refresh-production
  cancel-in-progress: false

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Trigger authenticated weekly ratings refresh
        env:
          PIPELINE_BASE_URL: ${{ secrets.PIPELINE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ -z "$PIPELINE_BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "Missing required GitHub Actions secrets: PIPELINE_BASE_URL and/or CRON_SECRET"
            exit 1
          fi

          CLEAN_CRON_SECRET="$(printf %s "$CRON_SECRET" | tr -d "\r\n")"
          ENDPOINT_URL="${PIPELINE_BASE_URL%/}/api/cron/runWeeklyRatingsRefresh"

          if [[ "$MANUAL_RUN" == "true" ]]; then
            ENDPOINT_URL="${ENDPOINT_URL}?force=true"
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status_code="$(curl --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${CLEAN_CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --output "$response_file" \
            --write-out "%{http_code}" \
            "$ENDPOINT_URL")"

          cat "$response_file"

          if [[ ! "$status_code" =~ ^2 ]]; then
            printf '## Weekly ratings refresh\n\n- Status: failed (HTTP %s)\n- Ratings build did not receive a verified success response.\n' \
              "$status_code" >> "$GITHUB_STEP_SUMMARY"
            echo "Weekly ratings refresh failed with HTTP ${status_code}."
            exit 1
          fi

          if ! node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (payload.skipped) process.exit(0);
            if (!payload.ok || !payload.metadataVerified) process.exit(1);
            const summary = [
              "## Weekly ratings refresh",
              "",
              `- Status: ${payload.status}`,
              `- Current season refreshed: ${payload.seasonRefreshed}`,
              `- Historical loader: succeeded (${payload.historicalGamesLoaded} final games)`,
              `- Ratings build: succeeded (${payload.ratingsCount} team ratings)`,
              `- Historical range: ${payload.ratingsBuild.metadata.startSeason}-${payload.latestSeasonIncluded}`,
              `- Ratings generated: ${payload.ratingsGeneratedAt}`,
              `- Duration: ${payload.durationMs} ms`
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
            console.log(`Refresh complete: season=${payload.seasonRefreshed}, games=${payload.historicalGamesLoaded}, ratings=${payload.ratingsCount}, generatedAt=${payload.ratingsGeneratedAt}, durationMs=${payload.durationMs}`);
          ' "$response_file"; then
            printf '## Weekly ratings refresh\n\n- Status: failed (metadata verification was not confirmed)\n' \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Weekly ratings refresh response did not confirm successful metadata verification."
            exit 1
          fi
