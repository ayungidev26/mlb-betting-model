name: Season Readiness

on:
  schedule:
    - cron: "23 14 * 11,12,1-3 3"
  workflow_dispatch:
    inputs:
      check_odds:
        description: "Validate Odds API access with one provider request"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check production readiness
        env:
          PIPELINE_BASE_URL: ${{ vars.PIPELINE_BASE_URL || secrets.PIPELINE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_ODDS: ${{ inputs.check_odds }}
        run: |
          AUTH_SECRET="${CRON_SECRET:-$ADMIN_API_SECRET}"
          if [[ -z "$PIPELINE_BASE_URL" || -z "$AUTH_SECRET" ]]; then
            echo "Configure PIPELINE_BASE_URL and CRON_SECRET or ADMIN_API_SECRET."
            exit 1
          fi

          ENDPOINT="${PIPELINE_BASE_URL%/}/api/cron/checkSeasonReadiness"
          if [[ "$(TZ=America/New_York date +%m)" == "03" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ENDPOINT="$ENDPOINT?preseason=true&checkOdds=${CHECK_ODDS:-false}"
          fi
          curl --silent --show-error --fail-with-body --request POST \
            --header "Authorization: Bearer ${AUTH_SECRET}" "$ENDPOINT"
